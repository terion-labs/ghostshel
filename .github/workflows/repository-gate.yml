name: Repository gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  managed-conformance:
    name: Managed conformance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore GhostShell.slnx
      - name: Build
        run: dotnet build GhostShell.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test GhostShell.slnx --configuration Release --no-build --logger "trx;LogFilePrefix=${{ runner.os }}"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ runner.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: error

  format-and-boundaries:
    name: Format and architecture boundaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore GhostShell.slnx
      - run: dotnet format GhostShell.slnx --verify-no-changes --no-restore
      - run: dotnet test tests/GhostShell.Architecture.Tests/GhostShell.Architecture.Tests.csproj --configuration Release --no-restore

  portable-release-publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Publish portable desktop
        run: >-
          dotnet publish src/GhostShell.Desktop/GhostShell.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output artifacts/${{ matrix.rid }}
      - name: Upload package candidate
        uses: actions/upload-artifact@v7
        with:
          name: ghostshell-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error
