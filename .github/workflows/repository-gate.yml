name: Repository gate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Three-part macOS bundle version
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read
  security-events: write

concurrency:
  group: repository-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  terminal-native-assets:
    name: Build macOS terminal runtime
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore verified terminal payload cache
        id: terminal-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/artifacts/common
            native/artifacts/osx-arm64
          key: >-
            terminal-osx-arm64-${{ hashFiles(
              'scripts/build-libghostty-vt.sh',
              'scripts/build-terminal-font-assets.sh',
              'native/ghostty-vt/**',
              'licenses/native-terminal-components.json',
              'licenses/terminal-font-assets.json') }}
      - name: Build verified terminal payload
        if: steps.terminal-cache.outputs.cache-hit != 'true'
        shell: bash
        run: >-
          GHOSTSHELL_DOTNET="$(command -v dotnet)"
          ./scripts/build-libghostty-vt.sh --rid osx-arm64
      - name: Upload terminal font assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-font-test-assets
          path: native/artifacts/common
          if-no-files-found: error
          retention-days: 1
      - name: Upload terminal runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-native-osx-arm64
          path: native/artifacts/osx-arm64
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  managed-conformance:
    name: Tests (macOS, ${{ matrix.section }})
    needs: terminal-native-assets
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        section: [core, agent, app, services, data-browser, terminal-host]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Download terminal font assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-font-test-assets
          path: native/artifacts/common
      - name: Download macOS terminal runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-native-osx-arm64
          path: native/artifacts/osx-arm64
      - name: Restore the locked dependency graph
        shell: bash
        run: dotnet restore GhostShell.slnx --locked-mode
      - name: Run test section
        shell: bash
        run: ./scripts/test-section.sh "${{ matrix.section }}" --no-restore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ runner.os }}-${{ matrix.section }}
          path: ".test-results/**/*.trx"
          if-no-files-found: error
          include-hidden-files: true

  macos-release-build:
    name: Release build (macOS)
    needs: terminal-native-assets
    timeout-minutes: 45
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Download terminal font assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-font-test-assets
          path: native/artifacts/common
      - name: Download macOS terminal runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-native-osx-arm64
          path: native/artifacts/osx-arm64
      - name: Restore the locked dependency graph
        shell: bash
        run: dotnet restore GhostShell.slnx --locked-mode
      - name: Build the complete solution
        shell: bash
        run: dotnet build GhostShell.slnx --configuration Release --no-restore --nologo

  format-and-boundaries:
    name: Format and architecture boundaries
    needs: terminal-native-assets
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Download terminal font assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-font-test-assets
          path: native/artifacts/common
      - name: Download macOS terminal runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-native-osx-arm64
          path: native/artifacts/osx-arm64
      - name: Run the fast repository gate
        run: ./scripts/check.sh --quick

  codeql:
    name: CodeQL (C#)
    needs: terminal-native-assets
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Expose the SDK at the repository-local path
        run: |
          mkdir -p .dotnet
          ln -s "$(command -v dotnet)" .dotnet/dotnet
      - name: Download terminal font assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-font-test-assets
          path: native/artifacts/common
      - name: Download macOS terminal runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-native-osx-arm64
          path: native/artifacts/osx-arm64
      - name: Initialize CodeQL
        uses: github/codeql-action/init@faaa5d804fc648d0fdb28822a8e36cf7d0a6132c # v4.37.7
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended,security-and-quality
      - name: Restore the locked dependency graph
        run: dotnet restore GhostShell.slnx --locked-mode
      - name: Build the analyzed graph
        run: dotnet build GhostShell.slnx --configuration Release --no-restore
      - name: Analyze
        uses: github/codeql-action/analyze@faaa5d804fc648d0fdb28822a8e36cf7d0a6132c # v4.37.7

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          comment-summary-in-pr: never

  macos-early-release:
    name: macOS arm64 early release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [managed-conformance, macos-release-build, format-and-boundaries]
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Expose the SDK at the repository-local path
        run: |
          mkdir -p .dotnet
          ln -s "$(command -v dotnet)" .dotnet/dotnet
      - name: Set up the pinned Native Image toolchain
        uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1.6.4
        with:
          java-version: 25.0.4
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: true
      - name: Set up the Native AOT linker
        run: |
          brew install lld@22
          echo "GHOSTSHELL_NATIVE_AOT_LINKER=$(brew --prefix lld@22)/bin/ld64.lld" >> "${GITHUB_ENV}"
      - name: Resolve release version
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${REQUESTED_VERSION}"
          fi
          if [[ ! "${version}" =~ ^[0-9]{1,9}\.[0-9]{1,9}\.[0-9]{1,9}$ ]]; then
            echo "Release version must contain exactly three unsigned integer parts." >&2
            exit 64
          fi
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "The macOS release job requires an Apple Silicon runner." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Build verified native payloads
        run: |
          ./scripts/build-libghostty-vt.sh --rid osx-arm64
          ./scripts/build-sql-language-worker.sh --local --rid osx-arm64
          ./scripts/build-cef-runtime.sh --rid osx-arm64 --dotnet ./.dotnet/dotnet
      - name: Assemble macOS application
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p artifacts/macos-arm64
          ./scripts/package-macos.sh \
            --version "${RELEASE_VERSION}" \
            --build-version "${GITHUB_RUN_NUMBER}" \
            --runtime-identifier osx-arm64 \
            --output artifacts/macos-arm64/GhostShell.app
      - name: Archive release candidate
        run: |
          archive="GhostShell-macOS-arm64.zip"
          cd artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            macos-arm64/GhostShell.app \
            "${archive}"
          shasum -a 256 "${archive}" > "${archive}.sha256"
      - name: Upload macOS release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostshell-macos-arm64
          path: |
            artifacts/GhostShell-macOS-arm64.zip
            artifacts/GhostShell-macOS-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/GhostShell-macOS-arm64.zip \
            artifacts/GhostShell-macOS-arm64.zip.sha256 \
            --fail-on-no-commits \
            --generate-notes \
            --latest \
            --notes "Early unsigned Apple Silicon build for trusted testing only. macOS may quarantine or block the app because it does not yet have a Developer ID signature or notarization." \
            --title "GhostShell ${RELEASE_VERSION} early macOS release" \
            --verify-tag
