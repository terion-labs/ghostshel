name: Repository gate

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: read

concurrency:
  group: repository-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  terminal-native-assets:
    name: Build macOS terminal runtime
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Expose the SDK at the repository-local path
        run: |
          mkdir -p .dotnet
          ln -s "$(command -v dotnet)" .dotnet/dotnet
      - name: Restore verified terminal payload cache
        id: terminal-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/artifacts/common
            native/artifacts/osx-arm64
          key: >-
            terminal-osx-arm64-${{ hashFiles(
              'scripts/build-libghostty-vt.sh',
              'scripts/build-terminal-font-assets.sh',
              'native/ghostty-vt/**',
              'licenses/native-terminal-components.json',
              'licenses/terminal-font-assets.json') }}
      - name: Build verified terminal payload
        if: steps.terminal-cache.outputs.cache-hit != 'true'
        shell: bash
        run: >-
          GHOSTSHELL_DOTNET="$(command -v dotnet)"
          ./scripts/build-libghostty-vt.sh --rid osx-arm64
      - name: Upload terminal font assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-font-test-assets
          path: native/artifacts/common
          if-no-files-found: error
          retention-days: 1
      - name: Upload terminal runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-native-osx-arm64
          path: native/artifacts/osx-arm64
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  managed-conformance:
    name: Tests (macOS, ${{ matrix.section }})
    needs: terminal-native-assets
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        section: [core, agent, app, services, data-browser, terminal-host]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Expose the SDK at the repository-local path
        run: |
          mkdir -p .dotnet
          ln -s "$(command -v dotnet)" .dotnet/dotnet
      - name: Download terminal font assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-font-test-assets
          path: native/artifacts/common
      - name: Download macOS terminal runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-native-osx-arm64
          path: native/artifacts/osx-arm64
      - name: Restore the locked dependency graph
        shell: bash
        run: dotnet restore GhostShell.slnx --locked-mode
      - name: Run test section
        shell: bash
        run: ./scripts/test-section.sh "${{ matrix.section }}" --no-restore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ runner.os }}-${{ matrix.section }}
          path: ".test-results/**/*.trx"
          if-no-files-found: error
          include-hidden-files: true

  macos-release-build:
    name: Release build (macOS)
    needs: terminal-native-assets
    timeout-minutes: 45
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Expose the SDK at the repository-local path
        run: |
          mkdir -p .dotnet
          ln -s "$(command -v dotnet)" .dotnet/dotnet
      - name: Download terminal font assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-font-test-assets
          path: native/artifacts/common
      - name: Download macOS terminal runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-native-osx-arm64
          path: native/artifacts/osx-arm64
      - name: Restore the locked dependency graph
        shell: bash
        run: dotnet restore GhostShell.slnx --locked-mode
      - name: Build the complete solution
        shell: bash
        run: dotnet build GhostShell.slnx --configuration Release --no-restore --nologo

  format-and-boundaries:
    name: Format and architecture boundaries
    needs: terminal-native-assets
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Expose the SDK at the repository-local path
        run: |
          mkdir -p .dotnet
          ln -s "$(command -v dotnet)" .dotnet/dotnet
      - name: Download terminal font assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-font-test-assets
          path: native/artifacts/common
      - name: Download macOS terminal runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-native-osx-arm64
          path: native/artifacts/osx-arm64
      - name: Run the fast repository gate
        run: ./scripts/check.sh --quick

  macos-early-release:
    name: macOS arm64 early release
    needs: [managed-conformance, macos-release-build, format-and-boundaries]
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Expose the SDK at the repository-local path
        run: |
          mkdir -p .dotnet
          ln -s "$(command -v dotnet)" .dotnet/dotnet
      - name: Set up the pinned Native Image toolchain
        uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1.6.4
        with:
          java-version: 25.0.4
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: true
      - name: Set up the Native AOT linker
        run: |
          brew install lld@22
          echo "GHOSTSHELL_NATIVE_AOT_LINKER=$(brew --prefix lld@22)/bin/ld64.lld" >> "${GITHUB_ENV}"
      - name: Resolve release version
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "${version}" =~ ^[0-9]{1,9}\.[0-9]{1,9}\.[0-9]{1,9}$ ]]; then
            echo "Release version must contain exactly three unsigned integer parts." >&2
            exit 64
          fi
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "The macOS release job requires an Apple Silicon runner." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Select full Xcode 26 for adaptive icon compilation
        shell: bash
        run: |
          xcode_application="/Applications/Xcode.app"
          if [[ ! -d "${xcode_application}/Contents/Developer" ]] \
              || ! DEVELOPER_DIR="${xcode_application}/Contents/Developer" \
                  xcrun actool --version --output-format=human-readable-text \
                  | grep -Eq 'short-bundle-version: (2[6-9]|[3-9][0-9]|[1-9][0-9]{2,})(\.|$)'; then
            xcode_application="$(find /Applications -maxdepth 1 -type d \
              -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          fi
          if [[ -z "${xcode_application}" \
              || ! -d "${xcode_application}/Contents/Developer" ]]; then
            echo "The release runner does not provide full Xcode 26." >&2
            exit 1
          fi
          developer_directory="${xcode_application}/Contents/Developer"
          actool_version="$(DEVELOPER_DIR="${developer_directory}" \
            xcrun actool --version --output-format=human-readable-text)"
          if ! grep -Eq 'short-bundle-version: (2[6-9]|[3-9][0-9]|[1-9][0-9]{2,})(\.|$)' \
              <<< "${actool_version}"; then
            echo "The selected Xcode does not provide actool 26 or newer." >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=${developer_directory}" >> "${GITHUB_ENV}"
      - name: Build verified native payloads
        run: |
          ./scripts/build-libghostty-vt.sh --rid osx-arm64
          ./scripts/build-sql-language-worker.sh --local --rid osx-arm64
          ./scripts/build-cef-runtime.sh --rid osx-arm64 --dotnet ./.dotnet/dotnet
      - name: Configure Developer ID signing and notarization
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          for required in \
            APPLE_CERTIFICATE_P12_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_DEVELOPER_ID_APPLICATION \
            APPLE_NOTARY_ISSUER_ID \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_PRIVATE_KEY_BASE64; do
            if [[ -z "${!required}" ]]; then
              echo "Required release secret ${required} is not configured." >&2
              exit 1
            fi
          done

          signing_directory="${RUNNER_TEMP}/ghostshell-signing"
          signing_keychain="${signing_directory}/release.keychain-db"
          signing_password="$(uuidgen)"
          mkdir -p "${signing_directory}"
          echo "GHOSTSHELL_SIGNING_DIRECTORY=${signing_directory}" >> "${GITHUB_ENV}"
          echo "GHOSTSHELL_SIGNING_KEYCHAIN=${signing_keychain}" >> "${GITHUB_ENV}"
          printf '%s' "${APPLE_CERTIFICATE_P12_BASE64}" \
            | /usr/bin/base64 -D > "${signing_directory}/certificate.p12"
          printf '%s' "${APPLE_NOTARY_PRIVATE_KEY_BASE64}" \
            | /usr/bin/base64 -D > "${signing_directory}/AuthKey.p8"

          security create-keychain -p "${signing_password}" "${signing_keychain}"
          security set-keychain-settings -lut 21600 "${signing_keychain}"
          security unlock-keychain -p "${signing_password}" "${signing_keychain}"
          security import "${signing_directory}/certificate.p12" \
            -k "${signing_keychain}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${signing_password}" \
            "${signing_keychain}"
          security list-keychains -d user -s "${signing_keychain}"
          security default-keychain -d user -s "${signing_keychain}"
          security find-identity -v -p codesigning "${signing_keychain}" \
            | grep -Fq "${APPLE_DEVELOPER_ID_APPLICATION}"

          xcrun notarytool store-credentials ghostshell-ci \
            --keychain "${signing_keychain}" \
            --key "${signing_directory}/AuthKey.p8" \
            --key-id "${APPLE_NOTARY_KEY_ID}" \
            --issuer "${APPLE_NOTARY_ISSUER_ID}"
          echo "GHOSTSHELL_SIGNING_IDENTITY=${APPLE_DEVELOPER_ID_APPLICATION}" >> "${GITHUB_ENV}"
      - name: Assemble macOS application
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p artifacts/macos-arm64
          ./scripts/package-macos.sh \
            --version "${RELEASE_VERSION}" \
            --build-version "${GITHUB_RUN_NUMBER}" \
            --runtime-identifier osx-arm64 \
            --sign-identity "${GHOSTSHELL_SIGNING_IDENTITY}" \
            --notary-profile ghostshell-ci \
            --output artifacts/macos-arm64/GhostShell.app
      - name: Archive release candidate
        run: |
          archive="GhostShell-macOS-arm64.zip"
          cd artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            macos-arm64/GhostShell.app \
            "${archive}"
          shasum -a 256 "${archive}" > "${archive}.sha256"
          verification_directory="$(mktemp -d "${RUNNER_TEMP}/ghostshell-archive.XXXXXX")"
          trap 'rm -rf -- "${verification_directory}"' EXIT
          ditto -x -k "${archive}" "${verification_directory}"
          codesign --verify --deep --strict --verbose=2 \
            "${verification_directory}/GhostShell.app"
          spctl --assess --type execute --verbose=2 \
            "${verification_directory}/GhostShell.app"
          test "$(plutil -extract CFBundleShortVersionString raw \
            "${verification_directory}/GhostShell.app/Contents/Info.plist")" \
            = "${{ steps.release.outputs.version }}"
          info_plist="${verification_directory}/GhostShell.app/Contents/Info.plist"
          test "$(plutil -extract CFBundleDisplayName raw "${info_plist}")" = "GhostSHELL"
          test "$(plutil -extract CFBundleExecutable raw "${info_plist}")" = "GhostShell"
          test "$(plutil -extract CFBundleIdentifier raw "${info_plist}")" = "app.ghostshell"
          test "$(plutil -extract CFBundleIconName raw "${info_plist}")" = "GhostShell"
          assets_car="${verification_directory}/GhostShell.app/Contents/Resources/Assets.car"
          test -f "${assets_car}"
          assetutil --info "${assets_car}" > "${verification_directory}/Assets.info.json"
          grep -Fq '"AssetType" : "Icon Image"' "${verification_directory}/Assets.info.json"
          grep -Fq '"Name" : "GhostShell"' "${verification_directory}/Assets.info.json"
      - name: Upload macOS release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostshell-macos-arm64
          path: |
            artifacts/GhostShell-macOS-arm64.zip
            artifacts/GhostShell-macOS-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/GhostShell-macOS-arm64.zip \
            artifacts/GhostShell-macOS-arm64.zip.sha256 \
            --fail-on-no-commits \
            --generate-notes \
            --latest \
            --notes "Developer ID signed and notarized Apple Silicon build. The stapled application is verified with codesign and Gatekeeper after archive extraction before publication." \
            --title "GhostShell ${RELEASE_VERSION} early macOS release" \
            --verify-tag
      - name: Remove temporary signing credentials
        if: always()
        run: |
          if [[ -n "${GHOSTSHELL_SIGNING_KEYCHAIN:-}" && -f "${GHOSTSHELL_SIGNING_KEYCHAIN}" ]]; then
            security delete-keychain "${GHOSTSHELL_SIGNING_KEYCHAIN}"
          fi
          if [[ -n "${GHOSTSHELL_SIGNING_DIRECTORY:-}" && -d "${GHOSTSHELL_SIGNING_DIRECTORY}" ]]; then
            rm -rf -- "${GHOSTSHELL_SIGNING_DIRECTORY}"
          fi
